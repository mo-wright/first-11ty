<!doctype html>
<html lang="en">
<head>

      <link rel="stylesheet" href="css/style.css">
      <script type="module" src="js/is-land.js"></script>
      <script src="/js/timeline.js" defer></script>


     <meta charset="UTF-8">
     <meta name="viewport" 
           content="width=device-width, 
           user-scalable=no, 
           initial-scale=1.0, 
           maximum-scale=1.0, 
           minimum-scale=1.0">
     <meta http-equiv="X-UA-Compatible" 
           content="ie=edge">
     <title></title>
</head>
<body>
    <nav>
    | <a href="index.html">Home</a> | <a href="guide.html">Guide</a> | <a href="gallery.html">Gallery</a> | <a href="gallery-auto.html">Better Gallery</a> |
</nav>
    

<is-land on:visible>
  <div id="gallery" v-scope="{ active: 'all' }">
    <div class="filters">
      <button @click="active = 'all'" :class="{ on: active === 'all' }" :aria-pressed="active === 'all'">All</button>
      
      <button @click="active = 'nature'" :class="{ on: active === 'nature' }" :aria-pressed="active === 'nature'">nature</button>
      
      <button @click="active = 'portraits'" :class="{ on: active === 'portraits' }" :aria-pressed="active === 'portraits'">portraits</button>
      
      <button @click="active = 'sketches'" :class="{ on: active === 'sketches' }" :aria-pressed="active === 'sketches'">sketches</button>
      
    </div>
    <p aria-live="polite">Showing: <span v-text="active"></span></p>
    
    <section class="topic" v-show="active === 'all' || active === 'nature'">
      <h3>nature</h3>
      <div class="row">
        
        <figure>
          <img src="img/nature/first.jpg" alt="A dark, forested area.">
          <figcaption>PHOTO202, Sample One</figcaption>
        </figure>
        
        <figure>
          <img src="img/nature/second.jpg" alt="A brightly lit piece of limestone in a forested area.">
          <figcaption>PHOTO202, Sample Two</figcaption>
        </figure>
        
        <figure>
          <img src="img/nature/third.jpg" alt="Three trees, one fallen, with sunlight draping over them.">
          <figcaption>PHOTO202, Sample Three</figcaption>
        </figure>
        
      </div>
    </section>
    
    <section class="topic" v-show="active === 'all' || active === 'portraits'">
      <h3>portraits</h3>
      <div class="row">
        
        <figure>
          <img src="img/portraits/first.jpg" alt="A stylized illustration of Will Graham from Hannibal with deer antlers and a bloodied fist.">
          <figcaption>Will Graham</figcaption>
        </figure>
        
        <figure>
          <img src="img/portraits/second.jpg" alt="A painterly illustration of bbno$ in cabaret inspired makeup.">
          <figcaption>bbno$</figcaption>
        </figure>
        
      </div>
    </section>
    
    <section class="topic" v-show="active === 'all' || active === 'sketches'">
      <h3>sketches</h3>
      <div class="row">
        
        <figure>
          <img src="img/sketches/first.jpg" alt="A digital sketch of Beth, Mia, and Alice from the Evil Dead movies.">
          <figcaption>Beth, Mia, and Alice</figcaption>
        </figure>
        
        <figure>
          <img src="img/sketches/second.jpg" alt="A chibi-styled pencil sketch of vocaloid Hatsune Miku.">
          <figcaption>Hatsune Miku</figcaption>
        </figure>
        
        <figure>
          <img src="img/sketches/pim.png" alt="A marker sketch of Pim from Smiling Friends with angel wings and a halo.">
          <figcaption>Pim</figcaption>
        </figure>
        
      </div>
    </section>
    
  </div>

  <template data-island>
    <script type="module">
      import { createApp } from './js/petite-vue.js'
      createApp().mount('#gallery')
    </script>
  </template>
</is-land>

    <strong>Page last updated:</strong>

  <time class="fmt-date" datetime="2026-11-17T14:48:16-05:00">2026-11-17T14:48:16-05:00</time>

&middot;
<strong>Site last built:</strong>
<time class="fmt-date" datetime="2026-11-19T18:29:31.002Z">2026-11-19T18:29:31.002Z</time>

<is-land on:visible>
  <template data-island>
    <script type="module">
      const fmt = new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      });
      document.querySelectorAll("time.fmt-date").forEach((el) => {
        el.textContent = fmt.format(new Date(el.getAttribute("datetime")));
      });
    </script>
  </template>
</is-land>


</body>
</html>
